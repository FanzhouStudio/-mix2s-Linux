# The sdm845 Q6ASM PCM plays in S16_LE through ALSA's read/write path.
# PipeWire otherwise selects S24_LE and the speaker remains silent.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-.*sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        api.alsa.disable-mmap = true
      }
    }
  }
]
